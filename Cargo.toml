[package]
name = "ruru"
version = "0.1.0"
edition = "2021"
description = "Tiny, fast, GPU-accelerated UI framework with glass materials. Native + Web."
license = "MIT"

[dependencies]
wgpu = "30"
glyphon = "0.12"
bytemuck = { version = "1", features = ["derive"] }
winit = "0.30"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1"
png = "0.17"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", features = ["webgl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "CssStyleDeclaration", "HtmlElement"] }
console_error_panic_hook = "0.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
